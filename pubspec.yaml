name: toko_untag
description: E-Commerce UNTAG

publish_to: "none"
version: 2.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1

  # Firebase Authentication
  firebase_core: ^2.32.0
  firebase_auth: ^4.20.0

  # Networking
  http: ^1.1.0
  connectivity_plus: ^6.0.3 # cek status online/offline

  # Local Storage / Caching
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.2.2 # untuk preferensi ringan (mis. onboarding seen)
  path_provider: ^2.1.3

  # Native Device Feature - Kamera
  image_picker: ^1.1.2
  permission_handler: ^11.3.1

  # UI / UX
  cached_network_image: ^3.3.1
  badges: ^3.1.2
  intl: ^0.18.1
  smooth_page_indicator: ^1.1.0
  cupertino_icons: ^1.0.2
  shimmer: ^3.0.0 # skeleton loading

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.9
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
